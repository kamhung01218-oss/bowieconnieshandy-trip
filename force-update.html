<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔄 強制更新工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif;
    background: linear-gradient(180deg, #0f172a, #1e293b);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #e2e8f0;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px; padding: 28px 24px;
    max-width: 440px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 { font-size: 20px; font-weight: 900; margin: 0 0 6px; }
  .sub { font-size: 12px; color: #94a3b8; margin-bottom: 20px; line-height: 1.6; }
  button {
    width: 100%; padding: 14px; border-radius: 14px; border: none;
    font-family: inherit; font-size: 14px; font-weight: 900;
    cursor: pointer; transition: all 0.2s; color: white; margin-bottom: 10px;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
  .btn-primary { background: linear-gradient(135deg, #0ea5e9, #6366f1); }
  .btn-ghost { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); }
  .log {
    margin-top: 14px; padding: 12px;
    background: rgba(0,0,0,0.35); border-radius: 10px;
    font-family: Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.7;
    color: #94a3b8; max-height: 200px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
  }
</style>
</head>
<body>
<div class="card">
  <h1>🔄 強制更新工具</h1>
  <p class="sub">
    當你改了程式碼但手機還顯示舊版時，用這個工具一次清乾淨。<br>
    包含：Service Worker、Cache Storage、localStorage 快取。
  </p>

  <button class="btn-danger" onclick="nukeAll()">
    💥 全清並重新載入（最徹底）
  </button>

  <button class="btn-primary" onclick="clearSWOnly()">
    🔄 只清 Service Worker（保留登入狀態）
  </button>

  <button class="btn-ghost" onclick="checkSW()">
    🔍 檢查目前 SW 狀態
  </button>

  <div class="log" id="log">等待操作…</div>
</div>

<script>
const logEl = document.getElementById('log');
function log(msg) {
  const t = new Date().toLocaleTimeString('zh-HK');
  logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
}
window.addEventListener('load', () => {
  log('頁面已載入');
  checkSW();
});

async function checkSW() {
  if (!('serviceWorker' in navigator)) {
    log('❌ 此瀏覽器不支援 Service Worker');
    return;
  }
  const regs = await navigator.serviceWorker.getRegistrations();
  if (regs.length === 0) {
    log('ℹ️ 目前沒有註冊任何 Service Worker');
    return;
  }
  for (const reg of regs) {
    const sw = reg.active || reg.installing || reg.waiting;
    log(`✅ SW 已註冊：${sw ? sw.scriptURL : '(unknown)'}`);
    log(`   狀態：${sw ? sw.state : 'unknown'}`);
  }
  if ('caches' in window) {
    const keys = await caches.keys();
    log(`📦 目前 Cache 數量：${keys.length}`);
    keys.forEach(k => log(`   • ${k}`));
  }
}

async function clearSWOnly() {
  logEl.textContent = '';
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const reg of regs) {
        await reg.unregister();
        log(`🗑 已移除 SW`);
      }
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      for (const k of keys) {
        await caches.delete(k);
        log(`🗑 已刪除 Cache：${k}`);
      }
    }
    log('✅ 完成！即將重新載入…');
    setTimeout(() => location.reload(true), 800);
  } catch (e) {
    log('❌ 錯誤：' + e.message);
  }
}

async function nukeAll() {
  if (!confirm('⚠️ 這會清空所有快取與本機設定（含登入狀態），確定嗎？')) return;
  logEl.textContent = '';
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const reg of regs) {
        await reg.unregister();
        log(`🗑 已移除 SW`);
      }
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      for (const k of keys) {
        await caches.delete(k);
        log(`🗑 已刪除 Cache：${k}`);
      }
    }
    const theme = localStorage.getItem('tohoku_theme');
    localStorage.clear();
    if (theme) localStorage.setItem('tohoku_theme', theme);
    log('🗑 已清空 localStorage（保留主題）');
    log('✅ 完成！即將重新載入…');
    setTimeout(() => location.reload(true), 800);
  } catch (e) {
    log('❌ 錯誤：' + e.message);
  }
}
</script>
</body>
</html>
