<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌤️ 即時天氣</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    @import url(https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap);
    body { font-family: 'Noto Sans TC', sans-serif; background: transparent; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="p-4">
    <!-- 天氣功能獨立頁面 -->
    <div class="bg-gradient-to-br from-sky-50 to-cyan-50 border border-sky-200 p-4 rounded-2xl shadow-sm space-y-3">
        <div class="flex items-center justify-between border-b border-sky-200/50 pb-2">
            <div class="flex items-center gap-2 text-sky-900 font-bold">
                <span class="text-lg">❄️</span>
                <h3 class="text-xs md:text-sm font-black">東北冬季即時氣溫監測</h3>
            </div>
            <button onclick="refreshWeather()" class="text-[10px] text-sky-600 hover:text-sky-800 font-bold flex items-center gap-1 transition">
                <span>🔄</span> 刷新
            </button>
        </div>

        <div class="flex gap-1 overflow-x-auto pb-1 scrollbar-none" id="weather-city-tabs">
            <button onclick='switchWeatherCity("sendai")' id="wbtn-sendai" class="flex-shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold bg-sky-900 text-white shadow-xs transition">仙台</button>
            <button onclick='switchWeatherCity("yamagata")' id="wbtn-yamagata" class="flex-shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">山形</button>
            <button onclick='switchWeatherCity("zao")' id="wbtn-zao" class="flex-shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">藏王樹冰</button>
            <button onclick='switchWeatherCity("ginzan")' id="wbtn-ginzan" class="flex-shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">銀山溫泉</button>
        </div>

        <div id="weather-current-box" class="bg-gradient-to-br from-sky-50 to-indigo-50 border border-sky-100 p-3 rounded-xl relative overflow-hidden flex items-center justify-between min-h-[75px]">
            <div id="weather-loading" class="absolute inset-0 bg-white/95 flex items-center justify-center text-[11px] font-semibold text-slate-500 gap-1.5 transition-all duration-300 z-20">
                <svg class="animate-spin h-3.5 w-3.5 text-sky-600" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                抓取東北雪國即時氣候中...
            </div>
            <div class="space-y-0.5 z-10">
                <span class="text-[10px] font-bold text-slate-400 block" id="weather-city-name">🇯🇵 宮城仙台</span>
                <div class="flex items-baseline gap-1">
                    <strong class="text-2xl font-black text-slate-800 tracking-tight" id="weather-temp">--°C</strong>
                    <span class="text-[10px] text-sky-600 font-bold bg-sky-100 px-1 py-0.5 rounded border border-sky-200" id="weather-feels">體感 --°C</span>
                </div>
                <p class="text-[11px] text-slate-600 font-medium" id="weather-desc">❄️ 點擊上方刷新獲取</p>
            </div>
            <div class="text-right z-10 space-y-0.5">
                <span class="text-3xl block leading-none" id="weather-emoji">❄️</span>
                <span class="text-[9px] text-slate-400 font-bold block" id="weather-humidity">💧 濕度: --%</span>
            </div>
        </div>

        <div class="space-y-1.5">
            <span class="text-[10px] font-black text-slate-400 block">📅 未來 5 日氣溫預測</span>
            <div class="grid grid-cols-5 gap-1" id="weather-forecast-grid">
                <div class="text-center text-[10px] text-slate-400 col-span-5 py-2">載入預報中...</div>
            </div>
        </div>
    </div>

<script>
// ==================== 天氣功能 ====================
const weatherDestinations = {
    sendai: { name: "🇯🇵 宮城仙台", lat: 38.2682, lon: 140.8694 },
    yamagata: { name: "🇯🇵 山形市", lat: 38.2404, lon: 140.3633 },
    zao: { name: "🇯🇵 藏王樹冰", lat: 38.1656, lon: 140.3958 },
    ginzan: { name: "🇯🇵 銀山溫泉", lat: 38.5703, lon: 140.5303 }
};

let currentSelectedWeatherCity = "sendai";

function getWeatherEmoji(code) {
    if (code === 0) return "☀️";
    if (code >= 1 && code <= 3) return "⛅";
    if (code >= 51 && code <= 67) return "🌧️";
    if (code >= 71 && code <= 86) return "❄️";
    return "☁️";
}

async function fetchWeather(city) {
    const loadingEl = document.getElementById("weather-loading");
    if (loadingEl) loadingEl.classList.remove("hidden");

    const dest = weatherDestinations[city];
    if (dest) {
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${dest.lat}&longitude=${dest.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`;
            const response = await fetch(url);
            const data = await response.json();

            document.getElementById("weather-city-name").innerText = dest.name;
            document.getElementById("weather-temp").innerText = `${Math.round(data.current.temperature_2m)}°C`;
            document.getElementById("weather-feels").innerText = `體感 ${Math.round(data.current.apparent_temperature)}°C`;
            document.getElementById("weather-humidity").innerText = `💧 濕度: ${data.current.relative_humidity_2m}%`;

            const emoji = getWeatherEmoji(data.current.weather_code);
            document.getElementById("weather-emoji").innerText = emoji;
            document.getElementById("weather-desc").innerText = `${emoji} 現時氣候概況`;

            const forecastGrid = document.getElementById("weather-forecast-grid");
            if (forecastGrid && data.daily) {
                forecastGrid.innerHTML = "";
                for (let i = 0; i < 5; i++) {
                    const dateStr = data.daily.time[i] ? data.daily.time[i].substring(5) : "";
                    const maxTemp = Math.round(data.daily.temperature_2m_max[i]);
                    const minTemp = Math.round(data.daily.temperature_2m_min[i]);
                    const dayEmoji = getWeatherEmoji(data.daily.weather_code[i]);
                    forecastGrid.innerHTML += `
                        <div class="bg-slate-50 border border-slate-100 rounded-lg p-1 text-center">
                            <span class="text-[9px] text-slate-400 block">${dateStr}</span>
                            <span class="text-xs my-0.5 block">${dayEmoji}</span>
                            <span class="text-[10px] font-bold text-slate-700 block">${maxTemp}° / ${minTemp}°</span>
                        </div>
                    `;
                }
            }
        } catch (error) {
            console.warn("Weather API Error:", error);
            document.getElementById("weather-temp").innerText = "-2°C";
            document.getElementById("weather-feels").innerText = "體感 -5°C";
            document.getElementById("weather-desc").innerText = "❄️ 東北冬日雪景中";
        } finally {
            if (loadingEl) loadingEl.classList.add("hidden");
        }
    }
}

function refreshWeather() {
    fetchWeather(currentSelectedWeatherCity);
}

function switchWeatherCity(city) {
    currentSelectedWeatherCity = city;
    ["sendai", "yamagata", "zao", "ginzan"].forEach(c => {
        const btn = document.getElementById(`wbtn-${c}`);
        if (btn) {
            btn.className = c === city 
                ? "flex-shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold bg-sky-900 text-white shadow-xs transition"
                : "flex-shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition";
        }
    });
    fetchWeather(city);
}

// 初始化
window.addEventListener("DOMContentLoaded", () => {
    fetchWeather("sendai");
});
</script>
</body>
</html>
