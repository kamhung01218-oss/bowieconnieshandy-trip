<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🛍️ 購物清單</title>
<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase SDK (Compat 版本) -->
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  body {
    font-family: 'Noto Sans TC', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: linear-gradient(180deg, #f0f9ff 0%, #ecfeff 40%, #f8fafc 100%);
    color: #1e293b;
    min-height: 100vh;
  }

  .scrollbar-none::-webkit-scrollbar { display: none; }
  .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

  /* 購物清單項目 */
  .shopping-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: white;
    transition: all 0.2s;
    border-bottom: 1px solid #f1f5f9;
  }

  .shopping-item:hover {
    background: #f8fafc;
  }

  .shopping-item.checked {
    opacity: 0.6;
  }

  .shopping-item.checked .shopping-name {
    text-decoration: line-through;
    color: #94a3b8;
  }

  .shopping-checkbox {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border: 2px solid #cbd5e1;
    border-radius: 6px;
    cursor: pointer;
    position: relative;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .shopping-checkbox:checked {
    background: #f43f5e;
    border-color: #f43f5e;
  }

  .shopping-checkbox:checked::after {
    content: '✓';
    color: white;
    font-size: 14px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-weight: bold;
  }

  .shopping-info {
    flex: 1;
    min-width: 0;
  }

  .shopping-name {
    font-size: 14px;
    font-weight: 600;
    color: #1e293b;
    display: block;
  }

  .shopping-meta {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 4px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .shopping-meta span {
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }

  .shopping-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .shopping-actions button {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.2s;
    border: 1px solid #e2e8f0;
    background: white;
  }

  .shopping-actions button:hover {
    background: #f1f5f9;
  }

  /* 地點下拉選單 */
  .shopping-location-select {
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 11px;
    width: 140px;
    outline: none;
    background: white;
    transition: border-color 0.2s;
    cursor: pointer;
  }

  .shopping-location-select:focus {
    border-color: #f43f5e;
  }

  /* 價格輸入框 */
  .shopping-price-input {
    width: 90px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 12px;
    text-align: right;
    outline: none;
    transition: border-color 0.2s;
  }

  .shopping-price-input:focus {
    border-color: #f43f5e;
  }

  /* 成員切換按鈕 */
  .shopping-member-tab {
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: bold;
    color: #64748b;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    transition: all 0.2s;
    white-space: nowrap;
    cursor: pointer;
  }

  .shopping-member-tab.active {
    background: #f43f5e;
    color: white;
    border-color: #f43f5e;
    box-shadow: 0 2px 8px rgba(244, 63, 94, 0.3);
  }

  /* 頂部標題列 */
  .header-gradient {
    background: linear-gradient(135deg, #f43f5e, #ec4899);
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #1e293b;
    color: white;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: bold;
    z-index: 9999;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* 雪花背景 */
  .snowflake-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  /* 身份驗證 Modal */
  .auth-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.7);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s;
  }

  .auth-modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .auth-modal {
    background: white;
    border-radius: 24px;
    padding: 24px;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    transform: scale(0.95);
    transition: transform 0.3s;
  }

  .auth-modal-overlay.active .auth-modal {
    transform: scale(1);
  }

  .auth-symbol-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    margin-top: 12px;
  }

  .auth-symbol-btn {
    aspect-ratio: 1;
    font-size: 24px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    background: white;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .auth-symbol-btn:hover {
    border-color: #f43f5e;
    background: #fff1f2;
  }

  .auth-symbol-btn.selected {
    border-color: #f43f5e;
    background: #f43f5e;
    color: white;
  }

  .auth-selected-symbols {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    min-height: 32px;
    align-items: center;
  }

  .auth-selected-symbols span {
    font-size: 24px;
  }

  .auth-status {
    margin-top: 12px;
    font-size: 12px;
    font-weight: bold;
    text-align: center;
  }
</style>
</head>
<body class="relative">

  <!-- 雪花背景 -->
  <div id="snow-fall" class="snowflake-bg"></div>

  <!-- Toast 通知 -->
  <div id="toast" class="toast">✅ 操作成功</div>

  <!-- 身份驗證 Modal -->
  <div id="auth-modal" class="auth-modal-overlay">
    <div class="auth-modal">
      <div class="text-center mb-4">
        <span class="text-3xl">🔐</span>
        <h3 class="text-lg font-black text-slate-900 mt-2">請確認身份</h3>
        <p class="text-xs text-slate-500 mt-1">輸入您的雙符號密碼以繼續操作</p>
      </div>
      <div class="text-center mb-3">
        <span id="auth-member-name" class="inline-block bg-rose-100 text-rose-700 px-4 py-1 rounded-full text-sm font-bold"></span>
      </div>
      <div id="auth-symbol-grid" class="auth-symbol-grid"></div>
      <div id="auth-selected-symbols" class="auth-selected-symbols"></div>
      <button onclick="verifyAuth()" class="w-full mt-3 bg-rose-500 hover:bg-rose-600 text-white py-3 rounded-xl font-bold transition active:scale-95">確認</button>
      <button onclick="closeAuthModal()" class="w-full mt-2 bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl font-bold transition text-sm">取消</button>
      <div id="auth-status" class="auth-status"></div>
    </div>
  </div>

  <!-- 主內容 -->
  <div class="max-w-4xl mx-auto px-4 py-8 relative z-10">

    <!-- 標題 -->
    <div class="header-gradient text-white p-6 rounded-3xl shadow-lg mb-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🛍️</span>
        <div>
          <h1 class="text-2xl font-black">購物清單</h1>
          <p class="text-sm opacity-90">每個人有自己的清單，雲端即時同步</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="copyCurrentUrl()" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl text-sm font-bold transition">
          📋 分享
        </button>
        <button onclick="exportShoppingList()" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl text-sm font-bold transition">
          📤 輸出
        </button>
      </div>
    </div>

    <!-- 成員切換 -->
    <div class="bg-white border border-slate-200 rounded-2xl p-2 mb-4 flex gap-2 overflow-x-auto scrollbar-none shadow-sm">
      <button class="shopping-member-tab active" data-member="余生" onclick="switchShoppingMember('余生')">余生 🌊</button>
      <button class="shopping-member-tab" data-member="bowie" onclick="switchShoppingMember('bowie')">bowie 🌸</button>
      <button class="shopping-member-tab" data-member="shandy" onclick="switchShoppingMember('shandy')">shandy 🌲</button>
      <button class="shopping-member-tab" data-member="Connie" onclick="switchShoppingMember('Connie')">Connie 🌺</button>
    </div>

    <!-- 統計卡 -->
    <div class="grid grid-cols-3 gap-3 mb-4">
      <div class="bg-gradient-to-br from-rose-500 to-pink-600 text-white p-4 rounded-2xl text-center shadow-sm">
        <span class="text-[10px] uppercase tracking-widest opacity-80 block mb-1">當前項目</span>
        <strong id="stat-count" class="text-2xl font-black">0</strong>
      </div>
      <div class="bg-gradient-to-br from-sky-500 to-blue-600 text-white p-4 rounded-2xl text-center shadow-sm">
        <span class="text-[10px] uppercase tracking-widest opacity-80 block mb-1">已購買</span>
        <strong id="stat-checked" class="text-2xl font-black">0</strong>
      </div>
      <div class="bg-gradient-to-br from-amber-500 to-orange-600 text-white p-4 rounded-2xl text-center shadow-sm">
        <span class="text-[10px] uppercase tracking-widest opacity-80 block mb-1">預算合計</span>
        <strong id="stat-total-price" class="text-2xl font-black">¥0</strong>
      </div>
    </div>

    <!-- 輸入區 -->
    <div class="bg-white border border-slate-200 rounded-2xl p-4 mb-4 shadow-sm">
      <div class="flex gap-2">
        <input id="shopping-input" placeholder="新增商品名稱..." class="flex-1 border border-slate-300 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500/50">
        <button onclick="addShoppingItem()" class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-3 rounded-xl text-sm font-bold transition active:scale-95 shadow-sm">
          ＋ 加入
        </button>
      </div>
    </div>

    <!-- 清單列表 -->
    <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
      <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
        <h3 class="text-sm font-bold text-slate-800" id="list-title">余生 的購物清單</h3>
        <span class="text-[11px] text-slate-500" id="list-hint">點擊勾選標記已購買</span>
      </div>
      <div id="shopping-list-container" class="divide-y divide-slate-100 max-h-[500px] overflow-y-auto">
        <div class="text-slate-400 text-xs italic text-center py-12">尚未新增任何購物項目</div>
      </div>
    </div>

    <!-- 使用說明 -->
    <div class="mt-6 bg-sky-50 border border-sky-200 rounded-2xl p-4 text-xs text-sky-900 leading-relaxed">
      <strong class="block mb-1">💡 使用說明</strong>
      <ul class="list-disc pl-4 space-y-1">
        <li>切換上方成員標籤，每個人有獨立的購物清單。</li>
        <li>點擊商品前面的圓形勾選框，可標記「已購買」。</li>
        <li>地點請從下拉選單選擇，避免輸入錯誤。</li>
        <li>刪除商品需輸入您的雙符號密碼，防止他人誤刪。</li>
        <li>所有資料即時同步到雲端，家人開啟同一頁面即可看到最新狀態。</li>
        <li>點擊「📋 分享」可複製網址，傳給家人共同編輯。</li>
      </ul>
    </div>
  </div>

  <script>
    // ==================== Firebase 初始化 ====================
    const firebaseConfig = {
      apiKey: "AIzaSyC0VQQWW0HQCd8CG8EuAN-kqnGirZHJ__E",
      authDomain: "tohoku-winter-trip.firebaseapp.com",
      projectId: "tohoku-winter-trip",
      storageBucket: "tohoku-winter-trip.firebasestorage.app",
      messagingSenderId: "991555590088",
      appId: "1:991555590088:web:afb089890d7d546821d2fd",
      measurementId: "G-XLDZRXC8RT"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    window.db = db;
    window.dbRef = db.collection("tohoku_trip").doc("shopping_list");

    // ==================== 全域變數 ====================
    const shoppingMembers = ["余生", "bowie", "shandy", "Connie"];
    const memberSymbols = {
      "余生": "🌊",
      "bowie": "🌸",
      "shandy": "🌲",
      "Connie": "🌺"
    };

    // 符號密碼（與記帳本一致）
    const memberPasswords = {
      "余生": ["🔵", "🟥"],
      "bowie": ["🩷", "🟨"],
      "shandy": ["🟢", "⬛"],
      "Connie": ["🟣", "🟦"]
    };

    const symbolPool = ["🔵", "🩷", "🟢", "🟣", "🔴", "🟠", "🟡", "🟤", "⚫", "⚪", "🟦", "🟧", "🟨", "🟩", "🟪", "🟥", "⬛", "⬜", "🔶", "🔷"];

    // 預設地點選單
    const locationOptions = [
      "仙台機場",
      "秋保溫泉",
      "AEON天童",
      "銀山溫泉",
      "天童溫泉",
      "藏王纜車",
      "山形市區",
      "寒河江草莓園",
      "Spring Valley",
      "狐狸村",
      "白石市",
      "仙台車站",
      "三井Outlet",
      "仔虎利府店",
      "水族館",
      "飯店",
      "其他"
    ];

    let currentShoppingMember = "余生";
    let shoppingItems = {}; // { "余生": [...], "bowie": [...], ... }

    // 身份驗證狀態
    let authMode = ''; // 'delete' 或 'clear'
    let authDeleteIndex = -1;
    let selectedMember = null;
    let selectedPasswordSymbols = [];
    let failedAttempts = 0;
    let lockUntil = 0;

    // ==================== 初始化 ====================
    async function initAuth() {
      try {
        await auth.signInAnonymously();
        console.log("Firebase 匿名登入成功！");
        loadLocalItems();
        renderShoppingList();
        setupFirebaseListener();
      } catch(err) {
        console.warn("登入失敗，嘗試匿名登入...", err);
        loadLocalItems();
        renderShoppingList();
      }
    }

    function setupFirebaseListener() {
      window.dbRef.onSnapshot(docSnap => {
        if (docSnap.exists) {
          const cloudData = docSnap.data();
          if (cloudData && cloudData.shoppingItems) {
            shoppingItems = cloudData.shoppingItems;
            shoppingMembers.forEach(m => {
              if (!shoppingItems[m]) shoppingItems[m] = [];
            });
            saveLocalItems();
            renderShoppingList();
          }
        }
      }, err => {
        console.warn("Firestore 同步警告:", err);
      });
    }

    // ==================== 本地儲存 ====================
    function loadLocalItems() {
      const saved = localStorage.getItem('shopping_items_2027');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          shoppingMembers.forEach(m => {
            shoppingItems[m] = parsed[m] || [];
          });
        } catch(e) {
          resetShoppingItems();
        }
      } else {
        resetShoppingItems();
      }
    }

    function resetShoppingItems() {
      shoppingMembers.forEach(m => shoppingItems[m] = []);
    }

    function saveLocalItems() {
      localStorage.setItem('shopping_items_2027', JSON.stringify(shoppingItems));
    }

    function syncToCloud() {
      if (auth.currentUser) {
        window.dbRef.set({ shoppingItems: shoppingItems, updatedAt: Date.now() }, { merge: true })
          .catch(e => console.warn('購物同步失敗:', e));
      }
    }

    // ==================== 成員切換 ====================
    function switchShoppingMember(member) {
      currentShoppingMember = member;
      document.querySelectorAll('.shopping-member-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.member === member);
      });
      renderShoppingList();
    }

    function getCurrentItems() {
      return shoppingItems[currentShoppingMember] || [];
    }

    // ==================== 顯示清單 ====================
    function renderShoppingList() {
      const container = document.getElementById('shopping-list-container');
      if (!container) return;

      const items = getCurrentItems();
      const totalSpan = document.getElementById('stat-count');
      const checkedSpan = document.getElementById('stat-checked');
      const priceSpan = document.getElementById('stat-total-price');
      const listTitle = document.getElementById('list-title');

      if (listTitle) listTitle.innerText = `${currentShoppingMember} 的購物清單`;

      let totalPrice = 0;
      let checkedCount = 0;
      items.forEach(item => {
        if (item.checked) checkedCount++;
        if (item.price) {
          totalPrice += parseFloat(item.price) || 0;
        }
      });

      if (totalSpan) totalSpan.innerText = items.length;
      if (checkedSpan) checkedSpan.innerText = checkedCount;
      if (priceSpan) priceSpan.innerText = `¥${totalPrice.toLocaleString('zh-HK')}`;

      if (items.length === 0) {
        container.innerHTML = `<div class="text-slate-400 text-xs italic text-center py-12">${currentShoppingMember} 尚未新增任何購物項目</div>`;
        return;
      }

      container.innerHTML = '';

      items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `shopping-item ${item.checked ? 'checked' : ''}`;
        
        // 地點下拉選單
        let locationOptionsHtml = '<option value="">選擇地點...</option>';
        locationOptions.forEach(loc => {
          locationOptionsHtml += `<option value="${loc}" ${item.location === loc ? 'selected' : ''}>${loc}</option>`;
        });

        div.innerHTML = `
          <input type="checkbox" class="shopping-checkbox" ${item.checked ? 'checked' : ''} onchange="toggleShoppingItem(${index})">
          <div class="shopping-info">
            <span class="shopping-name">${escapeHtml(item.name)}</span>
            <div class="shopping-meta">
              <span>💰 <input type="number" class="shopping-price-input" value="${item.price || ''}" placeholder="價格" onchange="updateShoppingPrice(${index}, this.value)"></span>
              <span>📍 <select class="shopping-location-select" onchange="updateShoppingLocation(${index}, this.value)">
                ${locationOptionsHtml}
              </select></span>
            </div>
          </div>
          <div class="shopping-actions">
            <button onclick="requestDeleteItem(${index})" title="刪除">🗑️</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    // ==================== 操作功能 ====================
    function addShoppingItem() {
      const input = document.getElementById('shopping-input');
      if (!input) return;
      const name = input.value.trim();
      if (!name) {
        showToast('⚠️ 請輸入商品名稱', '⚠️');
        return;
      }

      const items = getCurrentItems();
      items.push({
        name: name,
        price: '',
        location: '',
        checked: false
      });

      shoppingItems[currentShoppingMember] = items;
      input.value = '';
      saveLocalItems();
      syncToCloud();
      renderShoppingList();
      showToast('🛍️ 已加入購物清單！');
    }

    function toggleShoppingItem(index) {
      const items = getCurrentItems();
      if (items[index]) {
        items[index].checked = !items[index].checked;
        shoppingItems[currentShoppingMember] = items;
        saveLocalItems();
        syncToCloud();
        renderShoppingList();
      }
    }

    // 刪除需驗證
    function requestDeleteItem(index) {
      authMode = 'delete';
      authDeleteIndex = index;
      openAuthModal();
    }

    function deleteShoppingItem(index) {
      const items = getCurrentItems();
      items.splice(index, 1);
      shoppingItems[currentShoppingMember] = items;
      saveLocalItems();
      syncToCloud();
      renderShoppingList();
      showToast('🗑️ 已移除商品');
    }

    function updateShoppingPrice(index, value) {
      const items = getCurrentItems();
      if (items[index]) {
        items[index].price = value;
        shoppingItems[currentShoppingMember] = items;
        saveLocalItems();
        syncToCloud();
        renderShoppingList();
      }
    }

    function updateShoppingLocation(index, value) {
      const items = getCurrentItems();
      if (items[index]) {
        items[index].location = value;
        shoppingItems[currentShoppingMember] = items;
        saveLocalItems();
        syncToCloud();
        renderShoppingList();
      }
    }

    // ==================== 身份驗證 ====================
    function openAuthModal() {
      const modal = document.getElementById('auth-modal');
      const memberName = document.getElementById('auth-member-name');
      memberName.innerText = `${currentShoppingMember} ${memberSymbols[currentShoppingMember]}`;
      
      selectedMember = currentShoppingMember;
      selectedPasswordSymbols = [];
      failedAttempts = 0;
      lockUntil = 0;
      
      renderAuthSymbolGrid();
      updateAuthSelectedSymbols();
      
      const status = document.getElementById('auth-status');
      status.innerHTML = '';
      status.className = 'auth-status';
      
      modal.classList.add('active');
    }

    function closeAuthModal() {
      const modal = document.getElementById('auth-modal');
      modal.classList.remove('active');
      authMode = '';
      authDeleteIndex = -1;
      selectedPasswordSymbols = [];
    }

    function renderAuthSymbolGrid() {
      const grid = document.getElementById('auth-symbol-grid');
      grid.innerHTML = '';
      symbolPool.forEach(symbol => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.symbol = symbol;
        btn.innerText = symbol;
        btn.className = 'auth-symbol-btn';
        btn.onclick = () => {
          if (selectedPasswordSymbols.length >= 2) return;
          selectedPasswordSymbols.push(symbol);
          btn.classList.add('selected');
          updateAuthSelectedSymbols();
        };
        grid.appendChild(btn);
      });
    }

    function updateAuthSelectedSymbols() {
      const container = document.getElementById('auth-selected-symbols');
      container.innerHTML = '';
      selectedPasswordSymbols.forEach(symbol => {
        const span = document.createElement('span');
        span.innerText = symbol;
        container.appendChild(span);
      });
    }

    function verifyAuth() {
      const status = document.getElementById('auth-status');
      
      if (selectedPasswordSymbols.length !== 2) {
        status.innerHTML = '⚠️ 請點選兩個符號';
        status.style.color = '#f59e0b';
        return;
      }

      const now = Date.now();
      if (now < lockUntil) {
        const waitSeconds = Math.ceil((lockUntil - now) / 1000);
        status.innerHTML = `⏳ 請等待 ${waitSeconds} 秒後再試`;
        status.style.color = '#f59e0b';
        return;
      }

      const expected = memberPasswords[selectedMember];
      const isCorrect = selectedPasswordSymbols[0] === expected[0] && selectedPasswordSymbols[1] === expected[1];

      if (isCorrect) {
        status.innerHTML = '✅ 驗證成功！';
        status.style.color = '#10b981';
        
        // 執行操作
        if (authMode === 'delete' && authDeleteIndex >= 0) {
          deleteShoppingItem(authDeleteIndex);
        }
        
        setTimeout(() => closeAuthModal(), 500);
      } else {
        failedAttempts++;
        if (failedAttempts >= 5) {
          lockUntil = Date.now() + 30000;
          status.innerHTML = '❌ 嘗試次數過多，請等待 30 秒';
          status.style.color = '#ef4444';
        } else {
          status.innerHTML = `❌ 密碼錯誤，還剩 ${5 - failedAttempts} 次`;
          status.style.color = '#ef4444';
        }
        selectedPasswordSymbols = [];
        renderAuthSymbolGrid();
        updateAuthSelectedSymbols();
      }
    }

    // ==================== 分享與輸出 ====================
    function copyCurrentUrl() {
      const url = window.location.href;
      copyText(url);
      showToast('🔗 已複製分享連結！');
    }

    function exportShoppingList() {
      const items = getCurrentItems();
      if (items.length === 0) {
        showToast('⚠️ 目前沒有可輸出的項目', '⚠️');
        return;
      }

      let text = `🛍️ ${currentShoppingMember} 的購物清單\n`;
      text += '='.repeat(30) + '\n\n';
      
      items.forEach((item, i) => {
        const status = item.checked ? '✅' : '⬜';
        const price = item.price ? `¥${item.price}` : '';
        const location = item.location ? ` @${item.location}` : '';
        text += `${status} ${i + 1}. ${item.name}${price ? ` (${price})` : ''}${location}\n`;
      });

      copyText(text);
      showToast('📋 購物清單已複製！');
    }

    // ==================== 工具函式 ====================
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function copyText(text) {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      } catch(e) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
    }

    function showToast(message, icon = '✅') {
      const toast = document.getElementById('toast');
      if (toast) {
        toast.innerHTML = `${icon} ${message}`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
      }
    }

    // ==================== 雪花效果 ====================
    function initSnowEffect() {
      const snowContainer = document.getElementById('snow-fall');
      if (!snowContainer) return;
      snowContainer.innerHTML = '';
      const snowflakeCount = window.innerWidth < 768 ? 20 : 40;
      const colors = ['#ffffff', '#f0f9ff', '#e0f2fe', '#bae6fd'];
      const animations = ['snowfall', 'snowfall-small', 'snowfall-medium', 'snowfall-large'];
      
      const style = document.createElement('style');
      style.textContent = `
        .snowflake {
          position: absolute;
          top: -10px;
          border-radius: 50%;
          pointer-events: none;
          will-change: transform, opacity;
          box-shadow: 0 0 4px rgba(224, 242, 254, 0.8);
        }
        @keyframes snowfall {
          0% { transform: translateY(0) rotate(0deg); opacity: 1; }
          100% { transform: translateY(110vh) rotate(360deg); opacity: 0.5; }
        }
        @keyframes snowfall-small {
          0% { transform: translateY(0) rotate(0deg); opacity: 1; }
          100% { transform: translateY(100vh) rotate(180deg); opacity: 0.3; }
        }
        @keyframes snowfall-medium {
          0% { transform: translateY(0) rotate(0deg); opacity: 1; }
          100% { transform: translateY(90vh) rotate(270deg); opacity: 0.5; }
        }
        @keyframes snowfall-large {
          0% { transform: translateY(0) rotate(0deg); opacity: 1; }
          100% { transform: translateY(80vh) rotate(360deg); opacity: 0.7; }
        }
      `;
      document.head.appendChild(style);

      for (let i = 0; i < snowflakeCount; i++) {
        const snowflake = document.createElement('div');
        snowflake.className = 'snowflake';
        const size = Math.random() * 7 + 3;
        snowflake.style.cssText = `left: ${Math.random() * 100}%; width: ${size}px; height: ${size}px; background: ${colors[Math.floor(Math.random() * colors.length)]}; opacity: ${Math.random() * 0.4 + 0.1}; animation: ${animations[Math.floor(Math.random() * animations.length)]} ${Math.random() * 12 + 8}s linear infinite; animation-delay: ${Math.random() * -12}s;`;
        snowContainer.appendChild(snowflake);
      }
    }

    // ==================== 初始化 ====================
    window.addEventListener('DOMContentLoaded', () => {
      initSnowEffect();
      initAuth();
    });
  </script>
</body>
</html>
