<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎨 PWA 圖示生成器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif;
    background: linear-gradient(180deg, #0f172a, #1e293b);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #e2e8f0;
  }
  .card {
    background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px; padding: 28px 24px;
    max-width: 440px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  h1 {
    font-size: 20px; font-weight: 900; margin-bottom: 6px;
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .sub { font-size: 12px; color: #94a3b8; margin-bottom: 20px; line-height: 1.6; }
  .preview {
    display: flex; gap: 16px; justify-content: center;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .preview-item { text-align: center; }
  .preview-item canvas {
    border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    background: #0f172a;
  }
  .preview-item .label {
    font-size: 10px; color: #64748b; margin-top: 6px; font-weight: 700;
  }
  button {
    width: 100%; padding: 14px; border-radius: 14px; border: none;
    font-family: inherit; font-size: 14px; font-weight: 900;
    cursor: pointer; transition: all 0.2s; color: white;
    margin-bottom: 10px;
  }
  button:active { transform: scale(0.97); }
  .btn-primary {
    background: linear-gradient(135deg, #0ea5e9, #6366f1);
    box-shadow: 0 6px 20px rgba(14,165,233,0.4);
  }
  .note {
    font-size: 11px; color: #64748b; line-height: 1.6;
    margin-top: 16px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  code {
    background: rgba(0,0,0,0.3); padding: 2px 6px;
    border-radius: 4px; color: #7dd3fc; font-size: 10px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>🎨 PWA 圖示生成器</h1>
  <p class="sub">一鍵生成 3 張 PNG 圖示，下載後放到專案的 <code>/icons/</code> 資料夾即可。</p>

  <div class="preview">
    <div class="preview-item">
      <canvas id="c192" width="192" height="192" style="width:96px;height:96px;"></canvas>
      <div class="label">192 × 192</div>
    </div>
    <div class="preview-item">
      <canvas id="c512" width="512" height="512" style="width:96px;height:96px;"></canvas>
      <div class="label">512 × 512</div>
    </div>
    <div class="preview-item">
      <canvas id="cMask" width="512" height="512" style="width:96px;height:96px;"></canvas>
      <div class="label">Maskable</div>
    </div>
  </div>

  <button class="btn-primary" onclick="downloadAll()">⬇️ 一次下載全部 3 張</button>

  <p class="note">
    💡 下載後，把 3 個檔案放進專案根目錄的 <code>/icons/</code> 資料夾：<br>
    • <code>icons/icon-192.png</code><br>
    • <code>icons/icon-512.png</code><br>
    • <code>icons/icon-512-maskable.png</code>
  </p>
</div>

<script>
function drawIcon(canvas, maskable) {
  const size = canvas.width;
  const ctx = canvas.getContext('2d');
  const pad = maskable ? size * 0.18 : 0;

  // 背景漸層
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#0ea5e9');
  grad.addColorStop(0.5, '#0284c7');
  grad.addColorStop(1, '#0c4a6e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  // 柔光
  const radial = ctx.createRadialGradient(size * 0.3, size * 0.25, 0, size * 0.3, size * 0.25, size * 0.8);
  radial.addColorStop(0, 'rgba(255,255,255,0.3)');
  radial.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = radial;
  ctx.fillRect(0, 0, size, size);

  // 雪花
  ctx.font = `${size - pad * 2}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.3)';
  ctx.shadowBlur = size * 0.02;
  ctx.shadowOffsetY = size * 0.01;
  ctx.fillText('❄️', size / 2, size / 2 + size * 0.05);
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
}

function canvasToBlob(canvas) {
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function downloadAll() {
  const icons = [
    { canvas: document.getElementById('c192'), name: 'icon-192.png' },
    { canvas: document.getElementById('c512'), name: 'icon-512.png' },
    { canvas: document.getElementById('cMask'), name: 'icon-512-maskable.png' }
  ];

  for (const { canvas, name } of icons) {
    const blob = await canvasToBlob(canvas);
    downloadBlob(blob, name);
    await new Promise(r => setTimeout(r, 400)); // 避免瀏覽器擋下連續下載
  }

  // 若在 file:// 協議打開，需要提示使用者
  if (location.protocol === 'file:') {
    alert('✅ 已下載 3 張圖示。\n請把它們放進專案的 /icons/ 資料夾。');
  }
}

// 頁面載入時渲染預覽
document.addEventListener('DOMContentLoaded', () => {
  drawIcon(document.getElementById('c192'), false);
  drawIcon(document.getElementById('c512'), false);
  drawIcon(document.getElementById('cMask'), true);
});
</script>
</body>
</html>
